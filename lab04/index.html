<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Tareas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="container">
    <h1>Gestión de Tareas</h1>

    <!-- Contenedor para Alertas Dinámicas (Punto 2) -->
    <div id="alertContainer" class="alert-container" role="alert"></div>

    <!-- Formulario de Alta de Tareas (Punto 2) -->
    <section class="form-section">
      <h2>Agregar Tarea</h2>
      <form id="taskForm" novalidate>
        <div class="form-group">
          <label for="titulo">Título de la Tarea:</label>
          <input type="text" id="titulo" name="titulo" placeholder="Ej. Laboratorio 04" required>
        </div>

        <div class="form-group">
          <label for="curso">Curso:</label>
          <input type="text" id="curso" name="curso" placeholder="Ej. Desarrollo Web" required>
        </div>

        <div class="form-group">
          <label for="fechaEntrega">Fecha de Entrega:</label>
          <input type="date" id="fechaEntrega" name="fechaEntrega" required>
        </div>

        <button type="submit" id="btnGuardar">Guardar Tarea</button>
      </form>
    </section>

    <!-- Filtros Visuales (Punto 3) -->
    <section class="filter-section">
      <div class="filter-buttons">
        <button type="button" class="btn-filter active" data-filter="todas">Todas</button>
        <button type="button" class="btn-filter" data-filter="pendientes">Pendientes</button>
        <button type="button" class="btn-filter" data-filter="completadas">Completadas</button>
      </div>
    </section>

    <!-- Lista Dinámica de Tareas (Punto 3) -->
    <section class="tasks-section">
      <h2>Mis Tareas</h2>
      <ul id="taskList" class="task-list">
        <!-- Las tareas se renderizan dinámicamente con JavaScript -->
      </ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
