<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Tareas</title>
  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body class="bg-light">

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">

        <div class="card shadow">
          <div class="card-header bg-primary text-white">
            <h1 class="h3 mb-0">Gestión de Tareas</h1>
          </div>

          <div class="card-body">
            <!-- Contenedor para Alertas Dinámicas (Punto 2) -->
            <div id="alertContainer" role="alert"></div>

            <!-- Formulario de Alta de Tareas (Punto 2) -->
            <section class="form-section mb-4">
              <h2 class="h5 mb-3">Agregar Tarea</h2>
              <form id="taskForm" novalidate>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="titulo" class="form-label">Título de la Tarea:</label>
                    <input type="text" id="titulo" name="titulo" class="form-control" placeholder="Ej. Laboratorio 04" required>
                  </div>

                  <div class="col-md-6">
                    <label for="curso" class="form-label">Curso:</label>
                    <input type="text" id="curso" name="curso" class="form-control" placeholder="Ej. Desarrollo Web" required>
                  </div>

                  <div class="col-md-12">
                    <label for="fechaEntrega" class="form-label">Fecha de Entrega:</label>
                    <input type="date" id="fechaEntrega" name="fechaEntrega" class="form-control" required>
                  </div>

                  <div class="col-12">
                    <button type="submit" id="btnGuardar" class="btn btn-primary w-100">Guardar Tarea</button>
                  </div>
                </div>
              </form>
            </section>

            <hr class="my-4">

            <!-- Filtros Visuales (Punto 3) -->
            <section class="filter-section mb-3 d-flex justify-content-between align-items-center">
              <h2 class="h5 mb-0">Mis Tareas</h2>
              <div class="filter-buttons btn-group" role="group">
                <button type="button" class="btn btn-outline-primary btn-filter active" data-filter="todas">Todas</button>
                <button type="button" class="btn btn-outline-primary btn-filter" data-filter="pendientes">Pendientes</button>
                <button type="button" class="btn btn-outline-primary btn-filter" data-filter="completadas">Completadas</button>
              </div>
            </section>

            <!-- Lista Dinámica de Tareas (Punto 3) -->
            <section class="tasks-section">
              <ul id="taskList" class="task-list list-group">
                <!-- Las tareas se renderizan dinámicamente con JavaScript -->
              </ul>
            </section>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
